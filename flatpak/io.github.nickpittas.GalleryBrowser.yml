    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps
        greenlet==3.3.2
        six==1.16.0
        pypng==0.0.21
