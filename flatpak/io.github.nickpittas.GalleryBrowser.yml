app-id: io.github.nickpittas.GalleryBrowser
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
command: gallerybrowser
finish-args:
  # X11 + Wayland display access
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=fallback-x11
  # GPU acceleration
  - --device=dri
  # Audio playback (PulseAudio)
  - --socket=pulseaudio
  # Filesystem access for browsing media
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  # For drag-and-drop / file manager integration
  - --talk-name=org.freedesktop.FileManager1
  # For trash support
  - --talk-name=org.freedesktop.portal.Trash
  # Portal access
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  # DBus for single-instance check
  - --talk-name=org.freedesktop.DBus

cleanup-commands:
  - /app/cleanup-BaseApp.sh

modules:
  # ── PyGObject (for GStreamer Python bindings) ──────────────────────
  - name: pycairo
    buildsystem: meson
    sources:
      - type: archive
        url: https://github.com/pygobject/pycairo/releases/download/v1.28.0/pycairo-1.28.0.tar.gz
        sha256: 26ec5c6126781eb167089a123919f87baa2740da2cca9098be8b3a6b91cc5fbc

  - name: pygobject
    buildsystem: meson
    sources:
      - type: archive
        url: https://download.gnome.org/sources/pygobject/3.54/pygobject-3.54.5.tar.gz
        sha256: b6656f6348f5245606cf15ea48c384c7f05156c75ead206c1b246c80a22fb585

