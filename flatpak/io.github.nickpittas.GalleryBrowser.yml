# GalleryBrowser (Rust / egui + wgpu, ArtCraft stack) Flatpak manifest.
#
# Offline Cargo build: flatpak-builder has no network during the build, so every crate (including
# the pinned ArtCraft git dependencies) is vendored from a generated source list. Regenerate it
# whenever Cargo.lock changes, using flatpak-cargo-generator.py from
# https://github.com/flatpak/flatpak-builder-tools (cargo/ directory):
#
#   python3 flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json
#
# Then build and install locally:
#
#   flatpak-builder --user --install --force-clean flatpak/build-dir \
#       flatpak/io.github.nickpittas.GalleryBrowser.yml
app-id: io.github.nickpittas.GalleryBrowser
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: gallerybrowser
finish-args:
  - --share=ipc
  # Display: Wayland first, X11 only when Wayland is unavailable
  - --socket=wayland
  - --socket=fallback-x11
  # GPU (wgpu: Vulkan/GL)
  - --device=dri
  # Audio playback (cpal -> PulseAudio / PipeWire-pulse; ALSA goes through the same socket)
  - --socket=pulseaudio
  # Filesystem access for browsing media
  - --filesystem=home
  - --filesystem=/mnt
  - --filesystem=/media
  - --filesystem=/run/media
  # Reveal in file manager, trash, file chooser, portals
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.Trash

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/gallerybrowser/cargo
    CARGO_NET_OFFLINE: 'true'

modules:
  - name: gallerybrowser
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked -p gallerybrowser
      - install -Dm755 target/release/gallerybrowser /app/bin/gallerybrowser
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.desktop
        /app/share/applications/io.github.nickpittas.GalleryBrowser.desktop
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.metainfo.xml
        /app/share/metainfo/io.github.nickpittas.GalleryBrowser.metainfo.xml
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.svg
        /app/share/icons/hicolor/scalable/apps/io.github.nickpittas.GalleryBrowser.svg
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .git
          - .flatpak-builder
          - flatpak/build-dir
          - flatpak/repo
          - venv
          - .venv
          - .local_state
      # Generated by flatpak-cargo-generator.py (see header); not committed until generated.
      - cargo-sources.json
