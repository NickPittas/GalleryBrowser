  # ── GalleryBrowser application ─────────────────────────────────────
  - name: gallerybrowser
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} --no-build-isolation --no-deps .
      # Install desktop file
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.desktop
        ${FLATPAK_DEST}/share/applications/io.github.nickpittas.GalleryBrowser.desktop
      # Install metainfo
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/io.github.nickpittas.GalleryBrowser.metainfo.xml
      # Install icon (scalable SVG)
      - install -Dm644 flatpak/io.github.nickpittas.GalleryBrowser.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.nickpittas.GalleryBrowser.svg
    sources:
      - type: dir
        path: ..
        skip:
          - venv
          - .flatpak-builder
          - flatpak/build-dir
          - __pycache__
          - "*.pyc"
          - .ruff_cache
          - "*.egg-info"
