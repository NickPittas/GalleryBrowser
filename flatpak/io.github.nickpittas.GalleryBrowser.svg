<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background rounded rect -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="#181818" stroke="#2196F3" stroke-width="3"/>

  <!-- Grid of image thumbnails (3x2) -->
  <!-- Row 1 -->
  <rect x="16" y="20" width="28" height="22" rx="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="50" y="20" width="28" height="22" rx="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="84" y="20" width="28" height="22" rx="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Row 2 -->
  <rect x="16" y="48" width="28" height="22" rx="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="1"/>
  <rect x="50" y="48" width="28" height="22" rx="3" fill="#1a3a5c" stroke="#2196F3" stroke-width="1.5"/>
  <rect x="84" y="48" width="28" height="22" rx="3" fill="#2c2c2c" stroke="#3a3a3a" stroke-width="1"/>

  <!-- Mountain/landscape icon in highlighted cell -->
  <polygon points="54,66 60,56 66,63 70,58 76,66" fill="#4CAF50" opacity="0.7"/>
  <circle cx="58" cy="55" r="2.5" fill="#E2B340" opacity="0.8"/>

  <!-- Small mountain icons in other cells -->
  <polygon points="20,38 26,28 32,35 36,30 40,38" fill="#666666" opacity="0.4"/>
  <polygon points="54,38 58,30 62,35 66,30 74,38" fill="#666666" opacity="0.4"/>
  <polygon points="88,38 94,28 100,35 104,30 108,38" fill="#666666" opacity="0.4"/>
  <polygon points="20,66 26,56 32,63 36,58 40,66" fill="#666666" opacity="0.4"/>
  <polygon points="88,66 94,56 100,63 104,58 108,66" fill="#666666" opacity="0.4"/>

  <!-- Film strip / video indicator at bottom -->
  <rect x="16" y="80" width="96" height="28" rx="4" fill="#252525" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Film perforations -->
  <rect x="20" y="83" width="4" height="4" rx="1" fill="#444"/>
  <rect x="20" y="101" width="4" height="4" rx="1" fill="#444"/>
  <rect x="104" y="83" width="4" height="4" rx="1" fill="#444"/>
  <rect x="104" y="101" width="4" height="4" rx="1" fill="#444"/>
  <!-- Play triangle -->
  <polygon points="56,86 56,102 72,94" fill="#2196F3" opacity="0.9"/>

  <!-- "GB" text -->
  <text x="64" y="122" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a0a0a0" text-anchor="middle" opacity="0.6">GB</text>
</svg>
